# Calamares cho AgentOS (thay settings.conf của calamares-settings-debian; hook 0300-calamares chép vào /etc/calamares).
# Khác bản Debian: dùng thương hiệu "agentos" và BỎ trang chọn bàn phím (mặc định US, chủ máy dùng Telegram/điện thoại là chính;
# bàn phím Việt làm hỏng gõ lệnh quản trị). Bản gốc: Debian calamares-settings-debian 13.0.13-1.
---
modules-search: [ local, /usr/lib/calamares/modules ]
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - locale
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount
- show:
  - finished

branding: agentos
prompt-install: false
dont-chroot: false
