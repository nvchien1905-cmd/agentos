# Calamares: sau khi cài, gỡ các gói chỉ dành cho bản live khỏi hệ thống đích.
# Bản gốc của Debian gỡ cả live-task-localisation / live-task-recommended, nhưng ISO AgentOS không cài hai gói đó và apt
# trong hệ thống đích không có chỉ mục gói -> "Unable to locate package" làm cài đặt thất bại (phát hiện khi cài thử 19/10/2026).
# remove: gói CÓ trong ISO (lỗi thì cài đặt dừng). try_remove: gói có thể không có (lỗi thì bỏ qua).
---
backend: apt
update_db: false
update_system: false
skip_if_no_internet: false
operations:
  - remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'calamares-settings-debian'
      - 'calamares'
  - try_remove:
      - 'calamares-settings'
      - 'calamares-extensions'
      - 'live-task-localisation'
      - 'live-task-recommended'
