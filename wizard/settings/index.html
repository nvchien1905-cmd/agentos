<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cài đặt AgentOS</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17202b;--mute:#5b6b7c;--line:#dde3ea;--pri:#0b5c8f;--ok:#157a3c;--bad:#b3261e;--warn:#9a6700}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:15px/1.5 system-ui,"Noto Sans",sans-serif;color:var(--ink);background:var(--bg);display:flex}
nav{width:218px;height:100vh;overflow-y:auto;background:#12324a;color:#dbe7f0;padding:14px 8px;display:flex;flex-direction:column;gap:2px;flex:none}nav button{flex:none}nav::-webkit-scrollbar{width:8px}nav::-webkit-scrollbar-thumb{background:#2c5878;border-radius:4px}
nav h1{font-size:16px;margin:4px 10px 12px;color:#fff;letter-spacing:.2px}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;display:flex;gap:10px;align-items:center}
nav button:hover{background:#1c4766}nav button.on{background:#0b5c8f;color:#fff;font-weight:600}
main{flex:1;height:100vh;overflow:auto;padding:22px 28px}h2{margin:0 0 14px;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}
button.b{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer}button.b:hover{background:#eef3f8}
table.t button.b{padding:4px 10px;margin:2px 2px 2px 0}table.t select{max-width:170px;padding:4px 6px}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}button.p:hover{background:#0a4f7c}button.d{color:var(--bad)}button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;min-width:0}input[type=text],input[type=password]{flex:1}
.mute{color:var(--mute)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}small{color:var(--mute)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#aab4bf;margin-right:6px}.dot.active{background:#1fa34a}.dot.failed{background:#d33}.dot.inactive{background:#c9a227}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.app{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:#fff}
.bar{height:9px;background:#e3e9ef;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.banner{padding:10px 14px;border-radius:10px;margin-bottom:14px;background:#fff6dc;border:1px solid #ecd58a;color:#5c4400}
#log{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(10,20,30,.55);display:none;align-items:center;justify-content:center;z-index:9}
#log .box{background:#fff;border-radius:14px;width:min(860px,94vw);max-height:88vh;display:flex;flex-direction:column;padding:16px}
#log pre{background:#0d1620;color:#cfe3f3;border-radius:8px;padding:10px;overflow:auto;flex:1;min-height:260px;max-height:60vh;margin:10px 0;font:12.5px/1.45 ui-monospace,monospace;white-space:pre-wrap}
#toast{position:fixed;right:18px;bottom:18px;background:#17202b;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:10;max-width:60vw}
table{border-collapse:collapse;width:100%}td{padding:6px 4px;border-bottom:1px solid var(--line)}
.wg{display:grid;grid-template-columns:290px 1fr;gap:14px;align-items:start}.wl{max-height:82vh;overflow:auto}.wm{min-width:0}
.wi{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}.wi:hover{background:#f4f8fb}.wi.on{border-color:var(--pri);background:#eef6fc}
.wp{font-size:12.5px;color:var(--mute);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wrun{color:#1fa34a;font-weight:600}
.wtabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.wtabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.wtodo{background:#f3f7fb;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px}.wtodo div{padding:2px 0}.wtodo .completed{color:var(--mute);text-decoration:line-through}.wtodo .in_progress{font-weight:600}
.ev{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);align-items:flex-start}.ev time{color:var(--mute);font:12px ui-monospace,monospace;flex:none;padding-top:2px}.ev .bd{min-width:0;flex:1}
.ev.txt .bd{background:#f3f7fb;border-radius:8px;padding:8px 10px;white-space:pre-wrap}.ev details summary{cursor:pointer}.ev pre{margin:4px 0 0;background:#0d1620;color:#cfe3f3;border-radius:6px;padding:6px 8px;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all}
.wd{font:12.5px/1.45 ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:440px;margin:6px 0 10px}.wd div{white-space:pre-wrap;padding:0 8px;min-height:1.45em}
.wd .add{background:#e3f6e8}.wd .del{background:#fde8e6}.wd .skip{color:var(--mute);background:#f4f6f8;text-align:center}
.wf{padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.wf:hover{background:#f4f8fb}.wf code{word-break:break-all}
.wst-created{color:#157a3c}.wst-deleted{color:#b3261e}.wst-modified{color:#9a6700}
.wtree div{padding:4px 6px;border-bottom:1px solid var(--line);cursor:pointer}.wtree div:hover{background:#f4f8fb}.wprev{border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px;max-height:480px;overflow:auto}.wprev pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12.5px/1.45 ui-monospace,monospace}.wprev img{max-width:100%}.wprev iframe{width:100%;height:440px;border:0;background:#fff}
@media(max-width:900px){.wg{grid-template-columns:1fr}}
@media(max-width:760px){nav{width:62px}nav span.t{display:none}main{padding:14px}}
</style></head><body>
<nav id="nav"><h1>⚙ AgentOS</h1></nav>
<main id="main"><p class="mute">Đang tải...</p></main>
<div id="log"><div class="box"><div class="row"><b id="logt" class="grow"></b><span id="logs" class="mute"></span></div><pre id="logp"></pre><div class="row"><span class="grow mute" id="logh"></span><button class="b p" id="logc" disabled>Đóng</button></div></div></div>
<div id="toast"></div>
<script>
(function () {
  var TABS = [['overview', '🏠', 'Tổng quan'], ['acc', '🔐', 'Tài khoản đã lưu'], ['updates', '⬆️', 'Cập nhật'], ['apps', '📦', 'Ứng dụng'], ['ai', '🤖', 'AI và khóa API'], ['kv', '🏬', 'KiotViet'], ['vault', '🖥', 'Máy từ xa'], ['sess', '📋', 'Phiên'], ['bot', '💬', 'Bot Telegram'], ['mem', '🧠', 'Bộ nhớ của AI'], ['net', '📶', 'Mạng'], ['proj', '📁', 'Dự án'], ['dbk', '💾', 'Sao lưu ngoài'], ['usg', '📊', 'Chi phí AI'], ['aud', '🧾', 'Nhật ký'], ['watch', '👁', 'Màn hình AI'], ['conn', '🧩', 'Kết nối và kỹ năng'],['flt', '🖥️', 'Đội máy'], ['dev', '📷', 'Thiết bị'], ['cloud', '🗄️', 'Kho tệp riêng'], ['link', '☁️', 'Kết nối (OneDrive, Tailscale)'], ['sys', '🛠️', 'Hệ thống']];
  var cur = 'overview', main = document.getElementById('main'), timer = null;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function api(method, path, body) {
    return fetch('/api/' + path, { method: method, headers: { 'content-type': 'application/json', 'x-agentos-settings': '1' }, body: method === 'POST' ? JSON.stringify(body || {}) : undefined })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('Lỗi ' + r.status)); return j; }); });
  }
  function toast(t, bad) { var e = document.getElementById('toast'); e.textContent = t; e.style.background = bad ? '#8f1d16' : '#17202b'; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { e.style.display = 'none'; }, 5000); }
  function fail(e) { toast(e.message || String(e), true); }
  function ask(msg) { return window.confirm(msg); }
  // ĐĂNG NHẬP AI QUA ĐIỆN THOẠI: link + mã (Codex) hoặc ô dán mã (Claude/Gemini); gửi link sang Telegram để mở bằng điện thoại
  var loginEngine = null, loginTimer = null;
  function startPhoneLogin(eng) {
    loginEngine = eng; toast('Đang chuẩn bị đăng nhập ' + eng + '…');
    api('POST', 'ai/login/start', { engine: eng }).then(function () { pollPhoneLogin(eng); }).catch(function (e) { loginEngine = null; fail(e); });
  }
  function pollPhoneLogin(eng) {
    clearTimeout(loginTimer);
    api('GET', 'ai/login/state').then(function (v) {
      var box = document.getElementById('lgbox'); if (!box || v.engine !== eng) return;
      var x = '<h3>Đăng nhập ' + esc(eng) + ' bằng điện thoại</h3>';
      if (v.status === 'running') {
        if (!v.url) x += '<p class="mute">Đang chuẩn bị đường dẫn đăng nhập…</p>';
        else {
          x += '<p><a class="b p" href="' + esc(v.url) + '" target="_blank" rel="noopener">1. Mở trang đăng nhập</a> <button class="b" id="lgp">📱 Gửi link' + (v.code ? ' + mã' : '') + ' vào Telegram</button></p>';
          if (v.qr) x += '<div style="max-width:160px">' + v.qr + '</div><p class="mute">Hoặc quét mã QR bằng điện thoại.</p>';
          if (v.code) x += '<p>2. Nhập mã này vào trang đó rồi bấm Tiếp tục:</p><p style="font-size:30px;letter-spacing:4px;font-weight:700;text-align:center">' + esc(v.code) + '</p><p class="mute">Máy tự nhận khi bạn xong, không cần làm gì thêm. Tài khoản bật khóa bảo mật/xác thực 2 lớp thì làm trên điện thoại hoặc máy của bạn (có khóa), không cần cắm vào máy này.</p>';
          else if (v.needsInput) x += '<p>2. Đăng nhập xong, trang hiện một <b>mã</b>. Sao chép và dán vào đây:</p><div class="row"><input id="lgc" placeholder="Dán mã" autocomplete="off" style="flex:1"><button class="b p" id="lgs">Gửi mã</button></div>';
        }
        x += '<p><button class="b" id="lgx">Hủy</button></p>';
      } else if (v.status === 'done') { x += '<p class="ok">✔ Đăng nhập xong.</p>'; loginEngine = null; box.innerHTML = x; toast('Đã đăng nhập ' + eng); setTimeout(render, 1500); return; }
      else if (v.status === 'error') { x += '<p class="bad">Chưa được: ' + esc(v.error || 'lỗi không rõ') + '</p>' + (v.tail ? '<pre>' + esc(v.tail) + '</pre>' : ''); loginEngine = null; }
      var keep = document.getElementById('lgc') ? document.getElementById('lgc').value : '';
      if (box.getAttribute('data-h') !== x) { box.innerHTML = x; box.setAttribute('data-h', x); if (document.getElementById('lgc')) document.getElementById('lgc').value = keep; }
      box.style.display = 'block';
      var bp = document.getElementById('lgp'); if (bp) bp.onclick = function () { api('POST', 'ai/login/phone').then(function () { toast('Đã gửi vào Telegram, mở trên điện thoại'); }).catch(fail); };
      var bs = document.getElementById('lgs'); if (bs) bs.onclick = function () { api('POST', 'ai/login/input', { text: document.getElementById('lgc').value }).then(function () { toast('Đã gửi mã, đang chờ…'); }).catch(fail); };
      var bx = document.getElementById('lgx'); if (bx) bx.onclick = function () { api('POST', 'ai/login/cancel').then(function () { loginEngine = null; box.style.display = 'none'; box.setAttribute('data-h', ''); }); };
      if (v.status === 'running') loginTimer = setTimeout(function () { pollPhoneLogin(eng); }, 2000);
    }).catch(function () { loginTimer = setTimeout(function () { pollPhoneLogin(eng); }, 3000); });
  }

  // ----- cửa sổ nhật ký công việc nền -----
  function watchJob(id, title, done) {
    var box = document.getElementById('log'), pre = document.getElementById('logp'), c = document.getElementById('logc');
    document.getElementById('logt').textContent = title; document.getElementById('logs').textContent = 'đang chạy...'; document.getElementById('logh').textContent = '';
    pre.textContent = ''; c.disabled = true; box.style.display = 'flex';
    var from = 0, stop = false;
    c.onclick = function () { box.style.display = 'none'; stop = true; if (done) done(); render(); };
    (function poll() {
      if (stop) return;
      api('GET', 'jobs/' + id + '?from=' + from).then(function (j) {
        if (j.lines.length) { pre.textContent += j.lines.join('\n') + '\n'; pre.scrollTop = pre.scrollHeight; }
        from = j.next;
        if (j.status === 'running') return setTimeout(poll, 1200);
        document.getElementById('logs').textContent = j.status === 'done' ? '✓ xong' : '✗ lỗi';
        document.getElementById('logs').className = j.status === 'done' ? 'ok' : 'bad'; c.disabled = false;
      }).catch(function (e) { document.getElementById('logs').textContent = e.message; c.disabled = false; });
    })();
  }

  function nav() {
    var h = '<h1>⚙ AgentOS</h1>';
    TABS.forEach(function (t) { h += '<button data-t="' + t[0] + '" class="' + (t[0] === cur ? 'on' : '') + '">' + t[1] + ' <span class="t">' + t[2] + '</span></button>'; });
    var n = document.getElementById('nav'); n.innerHTML = h;
    [].forEach.call(n.querySelectorAll('button'), function (b) { b.onclick = function () { cur = b.getAttribute('data-t'); nav(); render(); }; });
  }
  function dot(s) { return '<span class="dot ' + esc(s) + '"></span>' + esc(s === 'active' ? 'đang chạy' : s === 'inactive' ? 'đã dừng' : s === 'failed' ? 'LỖI' : s); }
  function secs(n) { var d = Math.floor(n / 86400), h = Math.floor(n % 86400 / 3600), m = Math.floor(n % 3600 / 60); return (d ? d + ' ngày ' : '') + h + ' giờ ' + m + ' phút'; }
  function set(html) { main.innerHTML = html; }
  function on(id, fn) { var e = document.getElementById(id); if (e) e.onclick = fn; }
  function rebootBanner(o) { return o && o.rebootRequired ? '<div class="banner">⚠️ Máy cần <b>khởi động lại</b> để hoàn tất cập nhật. <button class="b" id="rb">Khởi động lại bây giờ</button></div>' : ''; }
  function wireReboot() { on('rb', function () { if (ask('Khởi động lại máy bây giờ?')) api('POST', 'power', { action: 'reboot', confirm: true }).then(function () { toast('Máy sẽ khởi động lại...'); }).catch(fail); }); }

  // ===== Các bot Telegram phụ (agent): mỗi bot một thẻ, có nút chỉnh mọi chế độ và quyền hạn =====
  function renderAgents() {
    var host = document.getElementById('agp'); if (!host) return;
    host.innerHTML = '<p class="mute">Đang tải các bot phụ...</p>';
    api('GET', 'bots').then(function (r) {
      var h = '<h2 style="margin-top:26px">🤖 Các bot phụ (agent)</h2><p class="mute">Mỗi bot phụ là một bot Telegram riêng, chạy độc lập (tài khoản hệ thống, dịch vụ, bộ nhớ và giới hạn RAM/CPU riêng) dưới sự quản lý của bot chính. Bot nào cũng được dặn: gặp lỗi phải tự tìm cách sửa và làm tiếp, chỉ dừng khi hết hạn mức hoặc cần việc chỉ chủ máy làm được. Bot chính điều khiển được bằng <b>/daily</b>.</p>';
      if (!r.agents.length) h += '<div class="card"><p class="mute">Chưa có bot phụ nào. Thêm ở khung bên dưới.</p></div>';
      r.agents.forEach(function (a) { h += agentCard(a, r); });
      h += '<div class="card"><h3>➕ Thêm bot phụ</h3><p class="mute">Tạo bot mới ở <b>@BotFather</b> (gõ <b>/newbot</b>), chép token dán vào đây. Mỗi bot phụ phải có token RIÊNG (không dùng lại token bot chính).</p>' +
        '<div class="row"><input type="password" id="ag-tk" placeholder="Token bot mới (123456789:AAAA...)" autocomplete="off" class="grow"><input type="text" id="ag-nm" placeholder="Tên gọi (tùy chọn)" style="width:200px"><button class="b p" id="ag-add">Thêm bot</button></div></div>';
      host.innerHTML = h;
      on('ag-add', function () {
        var tk = document.getElementById('ag-tk').value, nm = document.getElementById('ag-nm').value;
        toast('Đang tạo bot phụ...');
        api('POST', 'bots/agent/add', { token: tk, name: nm }).then(function (j) { toast('Đã tạo bot phụ ' + j.agent.id + (j.warn ? ' — ' + j.warn : '')); renderAgents(); }).catch(fail);
      });
      r.agents.forEach(function (a) { bindAgent(a, r); });
    }).catch(function (e) { host.innerHTML = '<div class="card"><p class="bad">Không tải được danh sách bot phụ: ' + esc(e.message || e) + '</p></div>'; });
  }

  function agentCard(a, r) {
    var st = a.status || {}, on1 = !!st.active;
    var h = '<div class="card" id="agc-' + a.id + '"><h3>' + esc(a.name) + ' <small class="mute">' + (a.bot ? '@' + esc(a.bot.username) : '') + ' · ' + a.id + '</small></h3>';
    h += '<p>' + (on1 ? '<span class="ok">● Đang chạy</span>' : '<span class="bad">● ' + (st.state === 'activating' ? 'Đang khởi động / lỗi, tự thử lại' : 'Đã dừng') + '</span>') +
      (st.memMb ? ' · dùng ' + st.memMb + ' MB RAM' : '') + (st.restarts ? ' · khởi động lại ' + st.restarts + ' lần' : '') + '</p>';
    h += '<div class="row" style="margin-bottom:12px">' +
      (on1 ? '<button class="b" data-ag="' + a.id + '" data-do="stop">⏸ Dừng</button>' : '<button class="b p" data-ag="' + a.id + '" data-do="start">▶ Chạy</button>') +
      '<button class="b" data-ag="' + a.id + '" data-do="restart">🔄 Khởi động lại</button><button class="b" data-ag="' + a.id + '" data-do="logs">📜 Nhật ký</button><button class="b d" data-ag="' + a.id + '" data-do="del">🗑 Xóa bot</button></div>';
    h += '<pre id="agl-' + a.id + '" class="keybox" style="display:none;white-space:pre-wrap;max-height:260px;overflow:auto"></pre>';
    h += '<h4 style="margin:10px 0 6px">Thông tin và giới hạn</h4><div class="row">' +
      '<label>Tên <input type="text" id="agn-' + a.id + '" value="' + esc(a.name) + '" style="width:170px"></label>' +
      '<label>ID được nhắn <input type="text" id="ago-' + a.id + '" value="' + esc((a.owners || []).join(',')) + '" style="width:200px"></label>' +
      '<label>RAM (MB) <input type="number" id="agr-' + a.id + '" value="' + a.ramMb + '" min="' + r.limits.ramMb[0] + '" max="' + r.limits.ramMb[1] + '" style="width:90px"></label>' +
      '<label>CPU (%) <input type="number" id="agc2-' + a.id + '" value="' + a.cpuPct + '" min="' + r.limits.cpuPct[0] + '" max="' + r.limits.cpuPct[1] + '" style="width:80px"></label>' +
      '<button class="b p" data-ag="' + a.id + '" data-do="info">Lưu</button></div>';
    h += '<h4 style="margin:14px 0 6px">Chế độ và quyền hạn</h4><div class="keybox" style="padding:10px 12px">';
    Object.keys(r.spec).forEach(function (k) {
      var d = r.spec[k], cur = a.settings && a.settings[k] !== undefined ? a.settings[k] : d.def, id = 'ags-' + a.id + '-' + k;
      h += '<div class="row" style="margin:6px 0"><span class="grow">' + esc(d.label) + '</span>';
      if (d.kind === 'bool') h += '<label><input type="checkbox" id="' + id + '" ' + (cur ? 'checked' : '') + '> Bật</label>';
      else if (d.kind === 'enum') h += '<select id="' + id + '">' + d.values.map(function (v) { return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('') + '</select>';
      else if (d.kind === 'int') h += '<input type="number" id="' + id + '" value="' + (cur == null ? '' : cur) + '" min="' + d.lo + '" max="' + d.hi + '" style="width:90px">';
      else h += '<input type="text" id="' + id + '" value="' + esc(cur == null ? '' : cur) + '" placeholder="(mặc định)" style="width:260px">';
      h += '</div>';
    });
    h += '<div class="row" style="margin-top:10px"><button class="b p" data-ag="' + a.id + '" data-do="perm">Lưu quyền hạn và khởi động lại bot</button><button class="b" data-ag="' + a.id + '" data-do="permreset">Về mặc định</button></div></div></div>';
    return h;
  }

  function bindAgent(a, r) {
    var card = document.getElementById('agc-' + a.id); if (!card) return;
    function val(k) {
      var d = r.spec[k], e = document.getElementById('ags-' + a.id + '-' + k); if (!e) return undefined;
      if (d.kind === 'bool') return e.checked;
      if (d.kind === 'int') return e.value === '' ? null : Number(e.value);
      return e.value.trim();
    }

        if (!c.installed) h += '<p><span class="mute">Chưa cài.</span></p><div class="row"><button class="b p" id="ci">Cài kho tệp riêng</button></div><p class="mute">Cần mạng, mất vài phút và khoảng 1,5 GB ổ đĩa lần đầu.</p>';
        else {
          h += '<p>' + (c.running ? '<span class="ok">✓ Đang chạy</span>' : '<span class="bad">Đang dừng</span>') + (c.version ? ' · bản ' + esc(c.version) : '') + ' · tài khoản <b>' + esc(c.user) + '</b></p>';
          h += '<p>Mở bằng trình duyệt hoặc ứng dụng Nextcloud trên điện thoại/máy tính: ' + (c.urls.length ? c.urls.map(function (u) { return '<a href="' + esc(u) + '" target="_blank">' + esc(u) + '</a>'; }).join(' · ') : '<span class="mute">chưa biết địa chỉ</span>') + '</p>';
          h += '<p class="mute">Ra ngoài nhà: kết nối Tailscale (mục Kết nối) rồi dùng địa chỉ Tailscale của máy này, không cần mở cổng ra Internet.</p>';
          h += '<div class="row"><button class="b" id="cp">Hiện mật khẩu</button><button class="b" id="cr">Đổi mật khẩu</button><button class="b" id="cx">Gỡ</button></div><div id="cpw"></div>';
        }
        set(h + '</div>');
        on('ci', function () { api('POST', 'cloud/install').then(function (j) { watchJob(j.job, 'Cài kho tệp riêng', render); }).catch(fail); });
        on('cp', function () { api('POST', 'cloud/password').then(function (r) { document.getElementById('cpw').innerHTML = '<p>Tài khoản: <b>' + esc(r.user) + '</b> · Mật khẩu: <code>' + esc(r.password) + '</code></p>'; }).catch(fail); });
        on('cr', function () { if (ask('Đổi mật khẩu kho tệp? Các thiết bị đang đăng nhập phải nhập lại.')) api('POST', 'cloud/reset-password', { confirm: true }).then(function (r) { document.getElementById('cpw').innerHTML = '<p>Mật khẩu mới: <code>' + esc(r.password) + '</code></p>'; }).catch(fail); });
        on('cx', function () { if (ask('Gỡ kho tệp riêng? Tệp trong thư mục chung vẫn giữ nguyên.')) api('POST', 'cloud/remove', { confirm: true }).then(function (j) { watchJob(j.job, 'Gỡ kho tệp', render); }).catch(fail); });
      }).catch(function (e) { set('<h2>Kho tệp riêng</h2><p class="bad">' + esc(e.message) + '</p>'); });
    },
    link: function () {
      Promise.all([api('GET', 'onedrive'), api('GET', 'tailscale')]).then(function (a) {
        var od = a[0], ts = a[1];
        set('<h2>Kết nối</h2><div class="card"><h3>OneDrive (Microsoft)</h3><p>' + (od.connected ? '<span class="ok">✓ Đã kết nối</span>' + (od.account && (od.account.email || od.account.name) ? ' · tài khoản <b>' + esc(od.account.email || od.account.name) + '</b>' : '') + ' · đồng bộ ' + dot(od.service) + ' · thư mục <b>' + esc(od.dir) + '</b> (' + (od.entries == null ? '?' : od.entries) + ' mục)' : '<span class="mute">Chưa kết nối</span>') + '</p><p class="mute">AI đọc dữ liệu và lưu kết quả vào OneDrive của bạn. Đồng bộ hai chiều với tài khoản Microsoft thật.</p><div class="row" id="odb"></div><div id="odx"></div><div id="odf2"></div></div>' +
          '<div class="card"><h3>Tailscale (đường vào dự phòng)</h3><p>' + (ts.state === 'Running' ? '<span class="ok">✓ Đã kết nối</span> · ' + esc((ts.ips || [])[0] || '') + ' ' + esc(ts.dns || '') : ts.state === 'missing' ? '<span class="bad">Chưa cài</span>' : '<span class="mute">Chưa đăng nhập (' + esc(ts.state) + ')</span>') + '</p><div class="row" id="tsb"></div><div id="tsx"></div></div>');
        var ob = document.getElementById('odb');
        ob.innerHTML = od.connected ? '<button class="b" id="os">Đồng bộ ngay</button><button class="b d" id="od">Ngắt kết nối</button>' : '<button class="b p" id="oc">Kết nối OneDrive</button>';
        if (od.connected) {
          document.getElementById('odf2').innerHTML = '<h4 style="margin:14px 0 4px">Thư mục OneDrive đồng bộ về máy</h4><p class="mute" style="margin:0 0 6px">' + (od.syncAll ? '<b class="bad">Đang đồng bộ TOÀN BỘ OneDrive</b> (có thể rất nặng).' : 'Chỉ các thư mục dưới đây được đồng bộ (mỗi dòng một thư mục). AI luôn cần <b>/AgentOS</b>.') + '</p>' +
            '<textarea id="odl" rows="4" style="width:100%;box-sizing:border-box">' + esc((od.folders || []).join('\n')) + '</textarea>' +
            '<div class="row" style="margin-top:6px"><button class="b p" id="odlsave">Lưu và đồng bộ lại</button><label class="mute"><input type="checkbox" id="odall"> Đồng bộ TOÀN BỘ OneDrive</label></div>';
          on('odlsave', function () {
            var all = document.getElementById('odall').checked;
            if (all && !ask('Đồng bộ TOÀN BỘ OneDrive có thể kéo hàng chục đến hàng trăm GB về máy và làm đầy ổ đĩa. Bạn chắc chắn?')) return;
            api('POST', 'onedrive/folders', { folders: document.getElementById('odl').value.split('\n'), all: all, confirmAll: all }).then(function (j) { watchJob(j.job, 'Đồng bộ lại OneDrive', render); }).catch(fail);
          });
        }
        on('os', function () { api('POST', 'onedrive/sync').then(function () { toast('Đã yêu cầu đồng bộ'); }).catch(fail); });
        on('od', function () { if (ask('Ngắt kết nối OneDrive? (tệp đã tải về vẫn giữ nguyên)')) api('POST', 'onedrive/disconnect', { confirm: true }).then(render).catch(fail); });
        on('oc', function () { toast('Đang lấy đường dẫn đăng nhập...'); api('POST', 'onedrive/start').then(function (j) {
          var manual = '<details' + (j.auto ? '' : ' open') + '><summary>' + (j.auto ? 'Không được? Dùng cách dán địa chỉ bằng tay' : 'Đăng nhập bằng cách dán địa chỉ') + '</summary><ol><li>Mở đường dẫn này, đăng nhập Microsoft và bấm Đồng ý: <br><a href="' + esc(j.url) + '" target="_blank" rel="noopener">' + esc(j.url.slice(0, 70)) + '...</a></li><li>Trang kết quả hiện cảnh báo vài giây rồi <b>tự chuyển</b> sang "Đây không phải là trang phù hợp". Đó là Microsoft đổi trang, KHÔNG phải lỗi của máy. Hãy copy TOÀN BỘ địa chỉ trên thanh địa chỉ ngay khi thấy (có chữ <b>nativeclient?code=</b>), hoặc bấm nút <b>←</b> Quay lại một lần rồi copy.</li><li>Dán vào đây: <div class="row"><input type="text" id="odr" placeholder="https://login.microsoftonline.com/common/oauth2/nativeclient?code=..."><button class="b p" id="odf">Hoàn tất</button></div></li></ol></details>';
          var auto = j.auto ? '<ol><li>Bấm nút bên dưới (mở cửa sổ mới), đăng nhập Microsoft và bấm <b>Đồng ý</b>.</li><li>Cửa sổ đó báo "Đã nhận mã đăng nhập" là xong: Cài đặt tự hoàn tất, <b>không cần copy gì</b>.</li></ol><p><a class="b p" style="display:inline-block;text-decoration:none" href="' + esc(j.autoUrl) + '" target="_blank" rel="noopener">Đăng nhập Microsoft</a> <span class="mute" id="ods">đang chờ bạn đăng nhập...</span></p>' : '';
          document.getElementById('odx').innerHTML = auto + manual;
          on('odf', function () { toast('Đang xác nhận...'); api('POST', 'onedrive/finish', { response: document.getElementById('odr').value }).then(function () { toast('✔ Đã kết nối OneDrive'); render(); }).catch(fail); });
          if (j.auto) {
            var tries = 0;
            (function poll() {
              if (cur !== 'link' || ++tries > 600) return;
              api('GET', 'onedrive/auth-status').then(function (s) {
                var el = document.getElementById('ods'); if (!el) return;
                if (s.status === 'done') { toast('✔ Đã kết nối OneDrive'); return render(); }
                if (s.status === 'error') { el.className = 'bad'; el.textContent = 'Lỗi: ' + s.error + ' — dùng cách dán địa chỉ bên dưới.'; var d = document.querySelector('#odx details'); if (d) d.open = true; return; }
                el.textContent = s.status === 'exchanging' ? 'đang hoàn tất...' : 'đang chờ bạn đăng nhập...';
                setTimeout(poll, 1500);
              }).catch(function () { setTimeout(poll, 3000); });
            })();
          }
        }).catch(fail); });
        var tb = document.getElementById('tsb');
        tb.innerHTML = ts.state === 'Running' ? '<button class="b d" id="td">Đăng xuất Tailscale</button>' : ts.state === 'missing' ? '' : '<button class="b p" id="tc">Kết nối Tailscale</button>';
        on('td', function () { if (ask('Đăng xuất Tailscale? Máy mất đường vào dự phòng.')) api('POST', 'tailscale/disconnect', { confirm: true }).then(render).catch(fail); });
        on('tc', function () { toast('Đang lấy đường dẫn đăng nhập...'); api('POST', 'tailscale/connect').then(function (j) {
          document.getElementById('tsx').innerHTML = j.already ? 'Đã kết nối.' : '<p>Mở đường dẫn, đăng nhập và bấm Connect (làm trong 10 phút): <br><a href="' + esc(j.url) + '" target="_blank" rel="noopener">' + esc(j.url) + '</a></p><button class="b" id="tr">Đã xong, kiểm tra lại</button>'; on('tr', render); }).catch(fail); });
      }).catch(fail);
    },
    sys: function () {
      Promise.all([api('GET', 'services'), api('GET', 'backup')]).then(function (a) {
        var s = a[0], b = a[1], names = { orchestrator: 'Bộ điều phối (bot)', deskd: 'Trợ lý màn hình', onedrive: 'Đồng bộ OneDrive', tailscale: 'Tailscale', cups: 'In ấn', network: 'Mạng', capnhat: 'Cập nhật từ xa', saoluu: 'Sao lưu hằng ngày' };
        var rows = '', opts = '';
        Object.keys(s.services).forEach(function (k) { rows += '<tr><td>' + esc(names[k] || k) + '</td><td>' + dot(s.services[k]) + '</td><td style="text-align:right">' + (s.restartable.indexOf(k) >= 0 ? '<button class="b" data-rs="' + k + '">Khởi động lại</button>' : '') + '</td></tr>'; opts += '<option value="' + k + '">' + esc(names[k] || k) + '</option>'; });
        var files = ''; b.files.forEach(function (f) { files += '<tr><td>' + esc(f.name) + '</td><td>' + esc(f.size) + '</td></tr>'; });
        set('<h2>Hệ thống</h2><div class="card"><h3>Dịch vụ</h3><table>' + rows + '</table></div><div class="card"><h3>Nhật ký</h3><div class="row"><select id="lu">' + opts + '</select><button class="b" id="lv">Xem</button></div><pre id="lp" style="background:#0d1620;color:#cfe3f3;border-radius:8px;padding:10px;max-height:300px;overflow:auto;font-size:12px;white-space:pre-wrap;display:none"></pre></div>' +
          '<div class="card"><h3>Sao lưu</h3><p class="mute">Mỗi ngày 02:30 lên OneDrive (không gồm mật khẩu/khóa). Thư mục: ' + esc(b.dir) + '</p><table>' + (files || '<tr><td class="mute">Chưa có bản sao lưu</td></tr>') + '</table><div class="row" style="margin-top:10px"><button class="b p" id="bk">Sao lưu ngay</button></div></div>' +
          '<div class="card"><h3>Nguồn điện</h3><div class="row"><button class="b" id="p1">Khởi động lại máy</button><button class="b d" id="p2">Tắt máy</button></div></div>');
        [].forEach.call(main.querySelectorAll('button[data-rs]'), function (x) { x.onclick = function () { api('POST', 'services/restart', { name: x.getAttribute('data-rs') }).then(function (j) { toast('Đã khởi động lại: ' + j.state); render(); }).catch(fail); }; });
        on('lv', function () { var p = document.getElementById('lp'); p.style.display = 'block'; p.textContent = 'Đang đọc...'; api('GET', 'logs?unit=' + document.getElementById('lu').value + '&lines=150').then(function (j) { p.textContent = j.text || '(trống)'; p.scrollTop = p.scrollHeight; }).catch(fail); });
        on('bk', function () { api('POST', 'backup/run').then(function (j) { watchJob(j.job, 'Sao lưu', render); }).catch(fail); });
        on('p1', function () { if (ask('Khởi động lại máy?')) api('POST', 'power', { action: 'reboot', confirm: true }).then(function () { toast('Máy sẽ khởi động lại...'); }).catch(fail); });
        on('p2', function () { if (ask('TẮT máy? (không bật lại từ xa được)')) api('POST', 'power', { action: 'poweroff', confirm: true }).then(function () { toast('Máy sẽ tắt...'); }).catch(fail); });
      }).catch(fail);
    }
  };
  function render() { clearInterval(timer); (pages[cur] || pages.overview)(); }
  nav(); render();
})();
</script></body></html>
