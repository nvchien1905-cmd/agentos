# live-build xóa khóa máy chủ SSH khỏi ảnh hệ thống; bản live tự tạo lại, nhưng bản ĐÃ CÀI thì không -> ssh.service lỗi ngay lần khởi động đầu
# (phát hiện khi cài thử 19/10/2026). Tạo khóa nếu thiếu trước khi kiểm cấu hình.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
