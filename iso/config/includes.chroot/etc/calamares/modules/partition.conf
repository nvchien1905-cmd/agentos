# Calamares: mini PC bán sẵn cài lên một ổ đĩa trống -> mặc định XÓA ĐĨA và dùng cả ổ (người dùng không phải chia phân vùng).
# Muốn snapshot quay lui bằng btrfs (GĐ 6c): đổi defaultFileSystemType thành btrfs và thêm bố cục subvolume.
---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 300M
defaultPartitionTableType: gpt
defaultFileSystemType: "ext4"
initialPartitioningChoice: erase
initialSwapChoice: none
